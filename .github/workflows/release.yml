name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: offline tests
        run: bash skills/syntropy/tests/run-tests.sh
      - name: package skill
        run: |
          mkdir -p dist/syntropy
          cp -R skills/syntropy/. dist/syntropy/
          echo "${GITHUB_REF_NAME}" > dist/syntropy/VERSION
          tar -C dist -czf syntropy-skill.tar.gz syntropy
          sha256sum syntropy-skill.tar.gz > syntropy-skill.tar.gz.sha256
      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" syntropy-skill.tar.gz syntropy-skill.tar.gz.sha256 --generate-notes

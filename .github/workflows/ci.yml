name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  skill:
    name: skill tests + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning -e SC2034,SC2164 skills/syntropy/scripts/*.sh install.sh
      - name: offline tests
        run: bash skills/syntropy/tests/run-tests.sh
